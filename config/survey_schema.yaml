# =============================================================================
# Murmur Survey Schema - Central Field Definitions
# =============================================================================
# version: 1.0.0
# schema_id: murmur_survey_v1
# last_updated: 2026-04-07
#
# RULES:
#   - Every survey field in the codebase MUST be defined here.
#   - validation.required MUST always be false. Nothing is ever required.
#   - To ADD a field: append to the appropriate section, bump version.
#   - To REMOVE a field: delete the entry, bump version, run migration.
#   - To RENAME a field: set migration_alias to the old name, update id,
#     bump version, run migration. Remove alias after migration completes.
#   - Never reuse a retired field id.
# =============================================================================

